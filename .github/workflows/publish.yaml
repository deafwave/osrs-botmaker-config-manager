name: Build and Publish
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  bump_version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.set_ref.outputs.ref }}
      should-publish: ${{ steps.set_ref.outputs.should-publish }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: ⏫ Bumping version
        id: bumping-version
        uses: jpb06/bump-package@latest
        with:
          major-keywords: BREAKING CHANGE
          minor-keywords: feat,minor
          patch-keywords: fix,chore

      - name: Set outputs
        id: set_ref
        shell: bash
        run: |
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "should-publish=true" >> "$GITHUB_OUTPUT"

  publish_npm:
    needs: bump_version
    if: needs.bump_version.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump_version.outputs.ref || github.ref }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          scope: '@deafwave'
          cache: 'pnpm'

      - name: Update NPM for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install & Build
        run: |
          pnpm i
          pnpm build

      - name: Omit storage exports for npm package
        shell: bash
        run: |
          sed -i "/export { getStoredBoolean, getStoredInt, getStoredString, setStoredBoolean, setStoredInt, setStoredString } from '.\/data\/storage.js';/d" dist/index.js dist/index.d.ts
          sed -i "/export type { RsProfileStorage } from '.\/data\/storage.js';/d" dist/index.d.ts

          if grep -Fq "export { getStoredBoolean, getStoredInt, getStoredString, setStoredBoolean, setStoredInt, setStoredString } from './data/storage.js';" dist/index.js || grep -Fq "export { getStoredBoolean, getStoredInt, getStoredString, setStoredBoolean, setStoredInt, setStoredString } from './data/storage.js';" dist/index.d.ts; then
            echo "Storage exports are still present in npm artifacts."
            exit 1
          fi

          if grep -Fq "export type { RsProfileStorage } from './data/storage.js';" dist/index.d.ts; then
            echo "RsProfileStorage root export is still present in npm artifacts."
            exit 1
          fi

      - name: Force npmjs registry for @deafwave scope
        shell: bash
        run: |
          npm config set @deafwave:registry https://registry.npmjs.org --location=project
          npm config set registry https://registry.npmjs.org --location=project
          npm config get @deafwave:registry
          npm config get registry

      - name: 🚀 Publish to npm
        run: pnpm publish --no-git-checks --access public --registry https://registry.npmjs.org

  publish_github:
    needs: bump_version
    if: needs.bump_version.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump_version.outputs.ref || github.ref }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@deafwave'
          cache: 'pnpm'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install & Build
        run: |
          pnpm i
          pnpm build

      - name: 🚀 Publish to GitHub Packages
        run: pnpm publish --no-git-checks --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
